previews:
  generation: automatic

services:
  - type: web
    name: fifa-2026-stadium-app
    runtime: node
    version: '18'
    region: oregon
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: push
    maxShutdownDelaySeconds: 30
    scaling:
      minInstances: 1
      maxInstances: 1
    envVars:
      - fromGroup: app-config
      - fromGroup: credentials
    ipAllowList:
      - source: 0.0.0.0/0
        description: public

envVarGroups:
  - name: app-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: LOG_LEVEL
        value: info
      - key: TELEMETRY_SIM_ENABLED
        value: 'true'

  - name: credentials
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: REDIS_URL
        sync: false
