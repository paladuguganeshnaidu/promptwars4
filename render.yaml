services:
  - type: web
    name: fifa-2026-stadium-app
    runtime: node
    runtimeVersion: '18'
    region: oregon
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TELEMETRY_SIM_ENABLED
        value: 'true'
